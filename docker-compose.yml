version: '3.8'

services:
  arbimine:
    build: .
    container_name: arbimine-pro
    ports:
            - "5000:5000"
    environment:
            - MIN_PROFIT=0.3
            - TOP_N_COINS=100
            - PYTHONUNBUFFERED=1
            - TZ=UTC
    restart: unless-stopped
    # Important for websocket stability
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # If your VPS has limited RAM, cap it so it doesn't get OOM killed
    mem_limit: 1g
    memswap_limit: 1g
